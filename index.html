<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Vizions TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Vizions Hospitality Lite — página de la caja (tv.vizionsnetworks.com dentro de TVLite).
     El navegador de algunas cajas es viejo: nada de `inset`, `gap` en flex, `aspect-ratio`
     ni `color-mix`; se escriben a mano. */
  :root { --accent: #2DD4BF; --accent-claro: #5EEAD4; --tinta: #F5F7F5; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: var(--tinta); }
  button { font-family: inherit; color: inherit; }
  #stage { width: 1920px; height: 1080px; position: fixed; top: 50%; left: 50%; overflow: hidden; background: linear-gradient(160deg, #16221d 0%, #0c1512 55%, #070a09 100%); }
  .lleno { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .oculto { display: none !important; }

  /* Fondo glass (por defecto) o el fondo que eligió la cuenta */
  .blob { position: absolute; border-radius: 50%; }
  .blob-1 { width: 1100px; height: 1100px; left: -320px; top: -380px; background: radial-gradient(circle, rgba(45,120,95,0.55) 0%, rgba(45,120,95,0) 70%); }
  .blob-2 { width: 900px; height: 900px; right: -260px; bottom: -320px; background: radial-gradient(circle, rgba(45,212,191,0.35) 0%, rgba(45,212,191,0) 70%); }
  .blob-3 { width: 700px; height: 700px; right: 120px; top: -260px; background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 70%); }
  .vin-1 { background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 100%); }
  .vin-2 { background: linear-gradient(120deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 45%); }
  #fondo-medio { background-size: cover; background-position: center; }
  #fondo-medio video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #fondo-velo { background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 35%, rgba(0,0,0,0.6) 100%); }

  .pantalla { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }

  /* Vidrio */
  .vidrio { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); -webkit-backdrop-filter: blur(44px) saturate(160%); backdrop-filter: blur(44px) saturate(160%); }

  /* ── Inicio ───────────────────────────────── */
  #saludo { position: absolute; left: 120px; top: 120px; font-size: 90px; font-weight: 300; letter-spacing: -0.01em; text-shadow: 0 4px 24px rgba(0,0,0,0.35); }
  #esquina { position: absolute; right: 120px; top: 120px; text-align: right; }
  #hora { font-size: 56px; font-weight: 300; text-shadow: 0 4px 24px rgba(0,0,0,0.35); }
  #fecha { font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.78); margin-top: 6px; }
  #clima-mini { display: -webkit-box; display: flex; -webkit-box-pack: end; justify-content: flex-end; -webkit-box-align: center; align-items: center; margin-top: 18px; font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.9); }
  #clima-mini svg { width: 30px; height: 30px; margin-right: 12px; }
  #clima-mini .punto { opacity: 0.6; margin: 0 12px; }
  #clima-mini .ciudad { font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.78); }

  #idioma { position: absolute; left: 50%; top: 124px; margin-left: -66px; width: 132px; height: 56px; border-radius: 999px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.09); }
  #idioma svg { margin-right: 10px; }
  #idioma span { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; }

  #fila { position: absolute; left: 120px; top: 648px; display: -webkit-box; display: flex; }
  .tile { width: 240px; height: 210px; margin-right: 40px; border-radius: 28px; cursor: pointer; display: -webkit-box; display: flex; -webkit-box-orient: vertical; flex-direction: column; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; box-shadow: 0 30px 60px rgba(0,0,0,0.35); transition: transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease; }
  .tile svg { margin-bottom: 22px; }
  .tile span { font-size: 22px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .tile.principal { width: 320px; border: 2px solid var(--accent); background: rgba(255,255,255,0.10); box-shadow: 0 0 0 4px rgba(45,212,191,0.3), 0 30px 60px rgba(0,0,0,0.4); }
  .tile.principal span { font-size: 26px; }
  .foco, button:focus { outline: none; }
  .tile:focus, .tile.foco { -webkit-transform: scale(1.06); transform: scale(1.06); background: rgba(255,255,255,0.18); border-color: #FFC83D; box-shadow: 0 0 0 6px rgba(255,200,61,0.45), 0 34px 70px rgba(0,0,0,.45); }
  #idioma:focus { -webkit-transform: scale(1.06); transform: scale(1.06); border-color: #FFC83D; box-shadow: 0 0 0 5px rgba(255,200,61,0.4); }

  /* Aviso (app no instalada, despertador) */
  #aviso { position: absolute; left: 50%; bottom: 96px; -webkit-transform: translateX(-50%); transform: translateX(-50%); display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; padding: 28px 40px; border-radius: 26px; background: rgba(20,24,22,0.82); border: 1px solid rgba(251,191,36,0.55); box-shadow: 0 30px 70px rgba(0,0,0,0.5); z-index: 30; max-width: 1200px; }
  #aviso .icono { width: 64px; height: 64px; border-radius: 50%; background: rgba(251,191,36,0.16); color: #FCD34D; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; -webkit-flex-shrink: 0; flex-shrink: 0; margin-right: 26px; }
  #aviso-titulo { font-size: 30px; font-weight: 700; }
  #aviso-texto { font-size: 22px; color: rgba(245,247,245,0.82); margin-top: 6px; }

  /* ── Activación ───────────────────────────── */
  #activar-velo { background: rgba(6,10,8,0.3); }
  #tarjeta-act { position: absolute; left: 50%; top: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); width: 980px; box-sizing: border-box; padding: 64px 72px; border-radius: 36px; text-align: center; box-shadow: 0 40px 90px rgba(0,0,0,0.45); }
  #tarjeta-act > * + * { margin-top: 30px; }
  .llave { width: 88px; height: 88px; border-radius: 26px; margin: 0 auto; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; background: rgba(45,212,191,0.16); border: 1px solid rgba(45,212,191,0.5); color: var(--accent-claro); }
  #tarjeta-act h1 { margin: 0; font-size: 56px; font-weight: 300; }
  #tarjeta-act p { margin: 12px 0 0; font-size: 26px; color: rgba(245,247,245,0.85); }
  #codigo { width: 560px; height: 120px; box-sizing: border-box; text-align: center; border-radius: 24px; border: 2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); color: var(--tinta); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 64px; font-weight: 700; letter-spacing: 0.14em; }
  #codigo:focus { outline: none; border-color: #FFC83D; box-shadow: 0 0 0 6px rgba(255,200,61,0.3); }
  #codigo::-webkit-input-placeholder { color: rgba(245,247,245,0.28); }
  #codigo.mal { border-color: #FB923C; }
  #act-error { font-size: 24px; color: #FED7AA; min-height: 32px; }
  #btn-activar { min-width: 360px; height: 88px; border-radius: 22px; border: 0; background: var(--accent); color: #062A24; font-size: 28px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  #btn-activar:focus { box-shadow: 0 0 0 6px rgba(255,200,61,0.55); }
  #btn-activar[disabled] { opacity: 0.55; }
  .listo { width: 104px; height: 104px; border-radius: 50%; margin: 0 auto; background: var(--accent); color: #062A24; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; }

  /* ── Extras ───────────────────────────────── */
  .velo-oscuro { background: rgba(6,10,8,0.38); }
  .pastilla-volver { position: absolute; left: 120px; top: 64px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; height: 56px; padding: 0 30px 0 20px; border-radius: 999px; background: rgba(10,14,12,0.55); border: 1.5px solid rgba(255,255,255,0.5); font-size: 20px; font-weight: 700; letter-spacing: 0.22em; cursor: pointer; }
  .pastilla-volver svg { margin-right: 12px; }
  .pastilla-volver:focus { border-color: #FFC83D; box-shadow: 0 0 0 5px rgba(255,200,61,0.4); }
  .titulo-lado { position: absolute; left: 120px; top: 200px; }
  .titulo-lado .grande { font-size: 84px; font-weight: 300; line-height: 1; }
  .titulo-lado .sub { font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.78); margin-top: 12px; }
  #tarjetas { position: absolute; left: 640px; top: 200px; width: 1160px; height: 560px; }
  .tarjeta { position: absolute; top: 0; width: 564px; height: 560px; overflow: hidden; padding: 0; border-radius: 28px; border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 20px 40px rgba(0,0,0,0.3); cursor: pointer; text-align: left; background: transparent; transition: transform .16s ease, box-shadow .16s ease; }
  .tarjeta:first-child { left: 0; } .tarjeta + .tarjeta { left: 596px; }
  .tarjeta .tinte { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .tarjeta .dibujo { position: absolute; left: 50%; top: 70px; margin-left: -85px; width: 170px; height: 170px; color: rgba(255,255,255,0.42); }
  .tarjeta .sombra { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(to top, rgba(8,12,10,0.88) 0%, rgba(8,12,10,0.25) 48%, rgba(8,12,10,0) 70%); }
  .tarjeta .ok { position: absolute; top: 20px; right: 20px; background: var(--accent); color: #062A24; font-weight: 800; font-size: 16px; letter-spacing: 0.14em; padding: 8px 16px; border-radius: 999px; display: none; }
  .tarjeta .textos { position: absolute; left: 30px; right: 30px; bottom: 28px; }
  .tarjeta .num { font-size: 16px; letter-spacing: 0.3em; font-weight: 800; color: var(--accent-claro); }
  .tarjeta .nombre { font-size: 40px; font-weight: 600; line-height: 1.1; margin-top: 6px; }
  .tarjeta .detalle { font-size: 20px; color: rgba(255,255,255,0.85); margin-top: 6px; }
  .tarjeta:focus { border: 3px solid #FFC83D; box-shadow: 0 0 0 7px rgba(255,200,61,0.3), 0 26px 50px rgba(0,0,0,0.45); -webkit-transform: scale(1.02); transform: scale(1.02); }
  .tarjeta:focus .ok { display: block; }
  .tarjeta.apagada .tinte { opacity: 0.55; }
  .teclas { position: absolute; left: 120px; bottom: 64px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; font-size: 19px; color: rgba(255,255,255,0.8); }
  .teclas > span { margin-right: 34px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; }
  .tecla { display: inline-block; min-width: 24px; height: 34px; line-height: 34px; padding: 0 10px; margin-right: 12px; text-align: center; border-radius: 9px; border: 1.5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.06); font-size: 15px; font-weight: 700; }
  .tecla.blanca { background: #F5F7F5; color: #111; border-color: #F5F7F5; font-weight: 800; }

  /* ── Clima ────────────────────────────────── */
  #clima-ahora { position: absolute; left: 120px; top: 230px; width: 620px; }
  #clima-ahora .temp { font-size: 190px; font-weight: 300; line-height: 1; }
  #clima-ahora .desc { font-size: 34px; font-weight: 600; margin-top: 10px; }
  #clima-ahora .ciudad { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.75); margin-top: 8px; }
  #clima-ahora .datos { margin-top: 36px; font-size: 22px; color: rgba(255,255,255,0.85); }
  #clima-ahora .datos div + div { margin-top: 10px; }
  #clima-icono { position: absolute; left: 520px; top: 230px; width: 200px; height: 200px; color: rgba(255,255,255,0.9); }
  #dias { position: absolute; left: 800px; top: 230px; width: 1000px; height: 520px; }
  .dia { position: absolute; top: 0; width: 184px; height: 520px; box-sizing: border-box; border-radius: 26px; padding: 34px 0; text-align: center; }
  .dia .nombre-dia { font-size: 22px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .dia svg { width: 84px; height: 84px; margin: 46px auto; display: block; color: rgba(255,255,255,0.92); }
  .dia .max { font-size: 44px; font-weight: 600; }
  .dia .min { font-size: 28px; color: rgba(255,255,255,0.6); margin-top: 6px; }
  .dia .lluvia { font-size: 20px; color: var(--accent-claro); margin-top: 26px; }
  .sin-dato { font-size: 28px; color: rgba(255,255,255,0.7); }

  /* ── Wallpaper (Ambient) ──────────────────── */
  #ambient { background: #000; z-index: 20; }
  .abm-capa { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; transition: opacity .9s ease; }
  .abm-capa.visible { opacity: 1; }
  .abm-ph { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background-size: cover; background-position: center; -webkit-animation: abmKb 24s linear forwards; animation: abmKb 24s linear forwards; }
  @-webkit-keyframes abmKb { from { -webkit-transform: scale(1); } to { -webkit-transform: scale(1.07); } }
  @keyframes abmKb { from { transform: scale(1); } to { transform: scale(1.07); } }
  .abm-vid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #abm-sombra { position: absolute; left: 0; right: 0; bottom: 0; height: 32vh; z-index: 3; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.38)); }
  #abm-hud { position: absolute; right: 63px; bottom: 56px; z-index: 4; text-align: right; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
  #abm-hora { font-size: 71px; font-weight: 300; line-height: 1; }
  #abm-linea { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: end; justify-content: flex-end; font-size: 20px; margin-top: 11px; }
  #abm-linea svg { width: 27px; height: 27px; margin: 0 9px 0 21px; }

  #negro { background: #000; z-index: 40; }
</style>
</head>
<body>
<div id="stage">
  <div id="fondo-glass" class="lleno">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
    <div class="lleno vin-1"></div><div class="lleno vin-2"></div>
  </div>
  <div id="fondo-medio" class="lleno oculto"></div>
  <div id="fondo-velo" class="lleno oculto"></div>

  <!-- Activación con el código de 8 números -->
  <section id="p-activar" class="pantalla oculto" aria-labelledby="act-titulo">
    <div id="activar-velo" class="lleno"></div>
    <div id="tarjeta-act" class="vidrio">
      <div id="act-paso1">
        <div class="llave"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3M15 8l2 2"></path></svg></div>
        <h1 id="act-titulo" style="margin-top:30px">Bienvenido</h1>
        <p id="act-instruccion">Escribe el código de activación de 8 números que te dieron con tu caja.</p>
        <div style="margin-top:30px">
          <label for="codigo" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Código de activación</label>
          <input id="codigo" type="text" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="0000 0000">
        </div>
        <div id="act-error" role="alert" style="margin-top:22px"></div>
        <button id="btn-activar" type="button" style="margin-top:22px">Activar</button>
      </div>
      <div id="act-paso2" class="oculto" role="status">
        <div class="listo"><svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
        <h1 style="margin-top:24px" id="listo-titulo">¡Listo!</h1>
        <p id="listo-texto">Tu caja quedó activada. En un momento aparece tu pantalla de inicio.</p>
      </div>
    </div>
  </section>

  <!-- Inicio -->
  <section id="p-inicio" class="pantalla oculto">
    <div id="saludo">Buenas tardes</div>
    <button id="idioma" class="vidrio" type="button" aria-label="Cambiar idioma">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.6 2.6 4 5.8 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.8-4-9s1.4-6.4 4-9z"></path></svg>
      <span id="idioma-txt">EN</span>
    </button>
    <div id="esquina">
      <div id="hora">--:--</div>
      <div id="fecha"></div>
      <div id="clima-mini" class="oculto"></div>
    </div>
    <div id="fila">
      <button id="btn-vertv" class="tile principal" type="button">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="13" rx="2"></rect><path d="M8 21h8"></path><path d="M7 3l5 3 5-3"></path></svg>
        <span id="t-vertv">Ver TV</span>
      </button>
      <button id="btn-apps" class="tile vidrio" type="button">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
        <span id="t-apps">Apps</span>
      </button>
      <button id="btn-extras" class="tile vidrio" type="button">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"></path></svg>
        <span id="t-extras">Extras</span>
      </button>
      <button id="btn-ajustes" class="tile vidrio" type="button">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span id="t-ajustes">Ajustes</span>
      </button>
    </div>
  </section>

  <!-- Extras -->
  <section id="p-extras" class="pantalla oculto">
    <div class="lleno velo-oscuro"></div>
    <button class="pastilla-volver" type="button" data-volver>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      <span class="t-inicio">INICIO</span>
    </button>
    <div class="titulo-lado"><div class="grande hora-lado">--:--</div><div class="sub" id="t-extras-sub">Extras</div></div>
    <div id="tarjetas">
      <button id="card-clima" class="tarjeta" type="button">
        <div class="tinte" style="background: linear-gradient(160deg, #3b7fb3 0%, #8cc3e0 100%);"></div>

  // ── Íconos del clima (código WMO) ─────────────────────────────────────────
  var IC = {

  function icono(codigo, dia) {
    var c = Number(codigo);
    if (c === 0 || c === 1) return dia === false ? 'luna' : 'sol';
    if (c === 2) return 'solnube';
    if (c === 3) return 'nube';
    if (c === 45 || c === 48) return 'niebla';
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'nieve';

    if (c >= 51) return 'lluvia';

  }

  }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ── Llamadas a la caja nativa (TVLite) ────────────────────────────────────

  var VISTA = /[?&]vista=panel(&|$)/.test(window.location.search);
  var ORIGENES_PANEL = ['https://lite.vizionsnetworks.com'].concat(window.LITE_PANEL_ORIGEN ? [window.LITE_PANEL_ORIGEN] : []);
  function nativo(url) {
    if (typeof window.__bancoNativo === 'function') { window.__bancoNativo(url); return; } // solo el banco de pruebas
    if (VISTA) { avisoVista(url); return; }
    window.location.href = url;
  }
  var appsCache = null, appsCacheT = 0;
  function appsInstaladas() {
    // El puente TVLite.getApps() existe desde la versión con el botón Apps. Si no está, no se sabe: se intenta abrir.
    if (!window.TVLite || typeof window.TVLite.getApps !== 'function') return null;
    if (appsCache && Date.now() - appsCacheT < 60000) return appsCache;

  }

  // Navegación con flechas: el elemento más cercano en esa dirección.

    if (lista.indexOf(actual) < 0) { var p = primerFoco(); if (p) p.focus(); return; }
    var a = actual.getBoundingClientRect();
    var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    var mejor = null, mejorD = Infinity;
    lista.forEach(function (el) {
      if (el === actual) return;
      var r = el.getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2;

  var TECLAS = { ArrowLeft: 'izq', ArrowRight: 'der', ArrowUp: 'arr', ArrowDown: 'aba', Left: 'izq', Right: 'der', Up: 'arr', Down: 'aba' };

      '<div class="datos"><div>' + esc(x.sensacion) + ' ' + esc(grados(a.sensacion)) + '</div>' +
      '<div>' + esc(x.humedad) + ' ' + esc(Math.round(a.humedad)) + '%</div>' +
      '<div>' + esc(x.viento) + ' ' + esc(Math.round(a.viento)) + ' km/h</div></div></div>' +
      '<div id="clima-icono">' + svgIc(icono(a.codigo, a.es_de_dia), 'width="200" height="200"') + '</div><div id="dias">';
    (clima.dias || []).slice(0, 5).forEach(function (d, i) {
      var f = new Date(d.fecha + 'T12:00:00');
      h += '<div class="dia vidrio" style="left:' + (i * 204) + 'px"><div class="nombre-dia">' + esc(i === 0 ? x.hoy : x.diasCortos[f.getDay()]) + '</div>' +
        svgIc(icono(d.codigo, true)) + '<div class="max">' + esc(grados(d.max)) + '</div><div class="min">' + esc(grados(d.min)) + '</div>' +
        (d.lluvia !== null && d.lluvia !== undefined ? '<div class="lluvia">' + esc(d.lluvia) + '% ' + esc(x.lluvia) + '</div>' : '') + '</div>';
    });
    cuerpo.innerHTML = h + '</div>';
  }
  function cargarClima() {
    if (VISTA || !leer(CLAVES.caja)) return;
    pedir('GET', '/api/caja/clima').then(function (j) { if (j.ok && j.clima) { clima = j.clima; pintarClima(); } }).catch(function () {});
  }
  setInterval(cargarClima, CADA_CLIMA_MS);

  // ── Fondo ─────────────────────────────────────────────────────────────────
  var fondoActual = null;
  function pintarFondo() {
    var f = cfg && cfg.fondo && cfg.fondo.url ? cfg.fondo : null;
    var clave = f ? f.url : '';
    if (clave === fondoActual) return;
    fondoActual = clave;
    var m = $('fondo-medio');
    m.innerHTML = ''; m.style.backgroundImage = '';
    if (!f) { m.classList.add('oculto'); $('fondo-velo').classList.add('oculto'); $('fondo-glass').classList.remove('oculto'); return; }
    if (/^video\//.test(f.mime || '')) {
      var v = document.createElement('video');
      v.muted = true; v.loop = true; v.autoplay = true; v.setAttribute('playsinline', ''); v.src = f.url;
      m.appendChild(v);
      var p = v.play(); if (p && p.catch) p.catch(function () {});
    } else {
      m.style.backgroundImage = 'url("' + f.url.replace(/"/g, '%22') + '")';
    }
    m.classList.remove('oculto'); $('fondo-velo').classList.remove('oculto'); $('fondo-glass').classList.add('oculto');
  }

  // ── Botones de inicio ─────────────────────────────────────────────────────
  function app() { return cfg && cfg.app && cfg.app.paquete ? cfg.app : { nombre: 'BlackEye', paquete: BLACKEYE }; }
  $('btn-vertv').addEventListener('click', function () {
    var a = app();
    var lista = appsInstaladas();
    if (lista && lista.indexOf(a.paquete) < 0) { avisar(t().noApp(a.nombre), t().noAppTexto); return; }
    // BlackEye se abre por su enlace propio (necesita CLEAR_TASK, ver bug de HOME en TVLite).
    nativo(a.paquete === BLACKEYE ? 'vizionstv://launch-blackeye' : 'vizionstv://launch-app?pkg=' + encodeURIComponent(a.paquete));
  });
  $('btn-apps').addEventListener('click', function () { nativo('vizionstv://open-apps?lang=' + idioma); });
  $('btn-ajustes').addEventListener('click', function () { nativo('vizionstv://open-settings'); });
  $('btn-extras').addEventListener('click', function () { mostrar('extras', 'card-clima'); });
  $('card-clima').addEventListener('click', function () { mostrar('clima'); pintarClimaDetalle(); var b = $('p-clima').querySelector('[data-volver]'); if (b) b.focus(); if (!clima) cargarClima(); });
  $('card-despertador').addEventListener('click', function () { avisar(t().despTitulo, t().despTexto); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-volver]'), function (b) { b.addEventListener('click', volver); });

  var avisoT = null;
  function avisar(titulo, texto) {
    $('aviso-titulo').textContent = titulo; $('aviso-texto').textContent = texto;
    $('aviso').classList.remove('oculto');
    clearTimeout(avisoT); avisoT = setTimeout(ocultarAviso, 5000);
  }
  function ocultarAviso() { $('aviso').classList.add('oculto'); }

  // ── Activación ────────────────────────────────────────────────────────────
  var codigo = $('codigo');
  codigo.addEventListener('input', function () {
    var d = codigo.value.replace(/\D/g, '').slice(0, 8);
    var v = d.length > 4 ? d.slice(0, 4) + ' ' + d.slice(4) : d;
    if (codigo.value !== v) codigo.value = v;
    codigo.classList.remove('mal'); $('act-error').textContent = '';
  });
  $('btn-activar').addEventListener('click', activar);
  var activando = false;
  function activar() {
    if (activando) return;
    var d = codigo.value.replace(/\D/g, '');
    if (d.length !== 8) { codigo.classList.add('mal'); $('act-error').textContent = t().ocho; codigo.focus(); return; }
    activando = true; $('btn-activar').disabled = true; $('btn-activar').textContent = t().activando;
    pedir('POST', '/api/caja/activar', { token: d, device_id: dispositivo(), version: 'web' }).then(function (j) {
      if (j._status === 201 && j.caja) {
        guardar(CLAVES.caja, j.caja);
        $('act-paso1').classList.add('oculto'); $('act-paso2').classList.remove('oculto');
        setTimeout(function () { cargarConfig(true); cargarClima(); }, 2500);
      } else {
        codigo.classList.add('mal'); $('act-error').textContent = j.error || t().sinRed; codigo.focus();
      }
    }).catch(function () {
      $('act-error').textContent = t().sinRed;
    }).then(function () {
      activando = false; $('btn-activar').disabled = false; $('btn-activar').textContent = t().activar;
    });
  }
  function pedirCodigo(mensaje) {
    guardar(CLAVES.caja, null); guardar(CLAVES.config, null); cfg = null; clima = null;
    $('act-paso1').classList.remove('oculto'); $('act-paso2').classList.add('oculto');
    codigo.value = ''; codigo.classList.remove('mal'); $('act-error').textContent = mensaje || '';
    pintarFondo();
    mostrar('activar');
  }

  // ── Configuración de la cuenta ────────────────────────────────────────────
  var refrescarVisto = null;
  function aplicar(nueva, primera) {
    var antes = cfg;
    // «Refrescar pantallas» del panel: si el contador cambió, recarga la página entera.
    // La primera configuración de cada carga solo aprende el contador (así no hay bucle).
    if (!VISTA && typeof nueva.refrescar === 'number') {
      if (refrescarVisto !== null && nueva.refrescar !== refrescarVisto) { guardar(CLAVES.config, JSON.stringify(nueva)); window.location.reload(); return; }
      refrescarVisto = nueva.refrescar;
    }
    cfg = nueva;
    guardar(CLAVES.config, JSON.stringify(nueva));
    if (nueva.vencido) { mostrar('vencido'); return; }
    pintarFondo(); pintarClima();
    if (primera || pantalla === 'vencido' || pantalla === 'activar' || pantalla === null) mostrar('inicio');
    // Lista nueva de wallpapers: se toma en el siguiente cambio de foto, desde el principio.
    if (!antes || JSON.stringify(antes.wallpapers || []) !== JSON.stringify(nueva.wallpapers || [])) { listaAmbient = null; idxAmbient = -1; }
  }
  function cargarConfig(primera) {
    if (!leer(CLAVES.caja)) { pedirCodigo(); return; }
    pedir('GET', '/api/caja/config').then(function (j) {
      if (j._status === 401) return pedirCodigo();
      if (j._status === 410) return pedirCodigo(t().baja);
      if (j.ok) aplicar(j, primera);
      else if (primera && cfg) aplicar(cfg, true);
    }).catch(function () {
      // Sin servidor: se queda con lo último que tenía (o la pantalla de inicio por defecto).
      if (primera) { if (cfg) aplicar(cfg, true); else mostrar('inicio'); }
    });
  }
  setInterval(function () { if (!VISTA && leer(CLAVES.caja)) cargarConfig(false); }, CADA_CONFIG_MS);

  // ── Wallpaper (Ambient): mismo diseño que hospitality ─────────────────────
  var ambientActivo = false, listaAmbient = null, idxAmbient = -1, capaAmbient = 'abm-a', abmTimer = null, videosBloqueados = false;
  function minutosAmbient() { return Math.max(1, Number(cfg && cfg.ambient_minutos) || 5); }
  function itemsAmbient() {
    var ws = (cfg && cfg.wallpapers) || [];
    return ws.filter(function (w) { return w.url && (w.tipo === 'foto' || !videosBloqueados); });
  }
  function revisarInactividad() {
    if (VISTA) return; // en la vista previa el wallpaper se pide con su botón
    if (ambientActivo || pantalla !== 'inicio' || document.hidden) return;
    if (Date.now() - ultimaActividad < minutosAmbient() * 60000) return;
    if (!itemsAmbient().length) return;
    entrarAmbient();
  }
  setInterval(revisarInactividad, 15000);
  function entrarAmbient() {
    ambientActivo = true; idxAmbient = -1; listaAmbient = null;
    $('ambient').classList.remove('oculto');
    hud();
    if (!clima) cargarClima();
    siguienteAmbient();
  }
  function salirAmbient() {
    if (!ambientActivo) return;
    ambientActivo = false; clearTimeout(abmTimer);
    ['abm-a', 'abm-b'].forEach(function (id) { soltarVideos($(id)); $(id).innerHTML = ''; $(id).classList.remove('visible'); });
    $('ambient').classList.add('oculto');
    ultimaActividad = Date.now();
  }
  function soltarVideos(el) {
    // En cajas modestas un video oculto sigue decodificando: se suelta.
    Array.prototype.forEach.call(el.querySelectorAll('video'), function (v) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {} });
  }
  function siguienteAmbient() {
    if (!ambientActivo) return;
    clearTimeout(abmTimer);
    if (!listaAmbient) listaAmbient = itemsAmbient();
    if (!listaAmbient.length) { salirAmbient(); return; }
    var unico = listaAmbient.length === 1;
    if (unico && idxAmbient === 0) return; // con un solo elemento no se repinta (evita parpadeo)
    idxAmbient = (idxAmbient + 1) % listaAmbient.length;
    var item = listaAmbient[idxAmbient];
    var vieja = $(capaAmbient);
    capaAmbient = capaAmbient === 'abm-a' ? 'abm-b' : 'abm-a';
    var capa = $(capaAmbient);
    soltarVideos(capa); capa.innerHTML = '';
    if (item.tipo === 'video') {
      var v = document.createElement('video');
      v.className = 'abm-vid'; v.muted = true; v.autoplay = true; v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      if (unico) v.loop = true;
      v.src = item.url;
      v.onended = function () { siguienteAmbient(); };
      v.onerror = function () { abmTimer = setTimeout(siguienteAmbient, 4000); };
      capa.appendChild(v);
      var p = v.play();
      if (p && p.catch) p.catch(function () {
        // Esta caja no deja arrancar videos solos: se usan solo las fotos (el APK v2 lo arregla).
        videosBloqueados = true; listaAmbient = null; idxAmbient = -1; abmTimer = setTimeout(siguienteAmbient, 300);
      });
      if (!unico) abmTimer = setTimeout(siguienteAmbient, 180000);
    } else {
      var ph = document.createElement('div');
      ph.className = 'abm-ph';
      ph.style.backgroundImage = 'url("' + String(item.url).replace(/"/g, '%22') + '")';
      if (item.image_pos) ph.style.backgroundPosition = item.image_pos.split(',').map(function (n) { return Number(n) + '%'; }).join(' ');
      capa.appendChild(ph);
      if (!unico) abmTimer = setTimeout(siguienteAmbient, 12000);
    }
    capa.classList.add('visible');
    vieja.classList.remove('visible');
    setTimeout(function () { if (!vieja.classList.contains('visible')) { soltarVideos(vieja); vieja.innerHTML = ''; } }, 1000);
  }
  function hud() {
    var d = new Date(), x = t();
    $('abm-hora').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    // «Sábado, 17 de octubre» / «Saturday, October 17»: solo mayúscula inicial (y meses en inglés).
    var f = x.fecha(d, x).toLowerCase();
    f = idioma === 'en' ? f.replace(/(^|\s)[a-z]/g, function (s) { return s.toUpperCase(); }) : f.charAt(0).toUpperCase() + f.slice(1);
    var linea = '<span>' + esc(f) + '</span>';
    if (clima && clima.ahora) linea += svgIc(icono(clima.ahora.codigo, clima.ahora.es_de_dia)) + '<span>' + esc(grados(clima.ahora.temp)) + '</span>';
    $('abm-linea').innerHTML = linea;
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) salirAmbient(); else ultimaActividad = Date.now(); });

  // ── Vista previa del panel ────────────────────────────────────────────────
  var NOMBRES_ACCION = { 'open-apps': 'la pantalla de apps', 'open-settings': 'los Ajustes de Android' };
  function avisoVista(url) {
    var m = /^vizionstv:\/\/([a-z-]+)/.exec(url) || [];
    var que = m[1] === 'launch-blackeye' || m[1] === 'launch-app' ? app().nombre : (NOMBRES_ACCION[m[1]] || 'esa opción');
    avisar('Vista previa', 'En la caja esto abre ' + que + '.');
  }
  function iniciarVista() {
    clima = null;
    mostrar('inicio');
    window.addEventListener('message', function (e) {
      if (ORIGENES_PANEL.indexOf(e.origin) < 0 || !e.data || e.data.tipo !== 'lite-vista') return;
      cfg = e.data.cfg || {};
      clima = e.data.clima || null;
      if (e.data.idioma === 'en' || e.data.idioma === 'es') idioma = e.data.idioma;
      pintarFondo(); pintarTextos();
      if (pantalla !== 'extras' && pantalla !== 'clima') mostrar('inicio');
      if (e.data.ambient) entrarAmbient(); else salirAmbient();
    });
    if (window.parent !== window) window.parent.postMessage({ tipo: 'lite-lista' }, '*'); // el panel contesta con la configuración
  }

  // ── Cajas con el APK viejo (antes del botón Apps) ─────────────────────────
  // No tienen el puente TVLite. Mientras se les instala el APK nuevo siguen como
  // siempre, sin pedir código: saludo, hora, Ver TV (BlackEye) y Ajustes.
  function esApkViejo() { return !window.TVLite && !leer(CLAVES.caja); }
  function modoViejo() {
    $('btn-apps').classList.add('oculto');
    $('btn-extras').classList.add('oculto');
    mostrar('inicio');
  }

  // ── Arranque ──────────────────────────────────────────────────────────────
  pintarTextos();
  if (VISTA) {
    iniciarVista();
  } else if (esApkViejo()) {
    modoViejo();
  } else if (leer(CLAVES.caja)) {
    if (cfg) aplicar(cfg, true); // pinta al instante con lo guardado; luego se actualiza
    cargarConfig(!cfg);
    cargarClima();
  } else {
    pedirCodigo();
  }

  // Para el banco de pruebas y la vista previa del panel (sin efecto en la caja).
  window.__lite = { estado: function () { return { pantalla: pantalla, ambient: ambientActivo, videosBloqueados: videosBloqueados, idx: idxAmbient, lista: listaAmbient ? listaAmbient.length : null }; }, ambientYa: function () { ultimaActividad = 0; revisarInactividad(); } };
})();
</script>
</body>
</html>
