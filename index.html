<!doctype html>

<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Vizions Hospitality Lite — página de la caja (tv.vizionsnetworks.com dentro de TVLite).
     El navegador de algunas cajas es viejo: nada de `inset`, `gap` en flex, `aspect-ratio`
     ni `color-mix`; se escriben a mano. */
  :root { --accent: #2DD4BF; --accent-claro: #5EEAD4; --tinta: #F5F7F5; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: var(--tinta); }
  button { font-family: inherit; color: inherit; }
  #stage { width: 1920px; height: 1080px; position: fixed; top: 50%; left: 50%; overflow: hidden; background: linear-gradient(160deg, #16221d 0%, #0c1512 55%, #070a09 100%); }
  .lleno { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .oculto { display: none !important; }

  /* Fondo glass (por defecto) o el fondo que eligió la cuenta */
  .blob { position: absolute; border-radius: 50%; }
  .blob-1 { width: 1100px; height: 1100px; left: -320px; top: -380px; background: radial-gradient(circle, rgba(45,120,95,0.55) 0%, rgba(45,120,95,0) 70%); }
  .blob-2 { width: 900px; height: 900px; right: -260px; bottom: -320px; background: radial-gradient(circle, rgba(45,212,191,0.35) 0%, rgba(45,212,191,0) 70%); }
  .blob-3 { width: 700px; height: 700px; right: 120px; top: -260px; background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 70%); }
  .vin-1 { background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 100%); }
  .vin-2 { background: linear-gradient(120deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 45%); }
  #fondo-medio { background-size: cover; background-position: center; }
  #fondo-medio video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #fondo-velo { background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 35%, rgba(0,0,0,0.6) 100%); }

  .pantalla { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }

  /* Vidrio */
  .vidrio { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); -webkit-backdrop-filter: blur(44px) saturate(160%); backdrop-filter: blur(44px) saturate(160%); }

  /* ── Inicio ───────────────────────────────── */
  #saludo { position: absolute; left: 120px; top: 120px; font-size: 90px; font-weight: 300; letter-spacing: -0.01em; text-shadow: 0 4px 24px rgba(0,0,0,0.35); }
  #esquina { position: absolute; right: 120px; top: 120px; text-align: right; }
  #hora { font-size: 56px; font-weight: 300; text-shadow: 0 4px 24px rgba(0,0,0,0.35); }
  #fecha { font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.78); margin-top: 6px; }
  #clima-mini { display: -webkit-box; display: flex; -webkit-box-pack: end; justify-content: flex-end; -webkit-box-align: center; align-items: center; margin-top: 18px; font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.9); }
  #clima-mini svg { width: 30px; height: 30px; margin-right: 12px; }
  #clima-mini .punto { opacity: 0.6; margin: 0 12px; }
  #clima-mini .ciudad { font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.78); }

  #idioma { position: absolute; left: 50%; top: 124px; margin-left: -66px; width: 132px; height: 56px; border-radius: 999px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.09); }
  #idioma svg { margin-right: 10px; }
  #idioma span { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; }

  #fila { position: absolute; left: 120px; top: 648px; display: -webkit-box; display: flex; }
  .tile { width: 240px; height: 210px; margin-right: 40px; border-radius: 28px; cursor: pointer; display: -webkit-box; display: flex; -webkit-box-orient: vertical; flex-direction: column; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; box-shadow: 0 30px 60px rgba(0,0,0,0.35); transition: transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease; }
  .tile svg { margin-bottom: 22px; }
  .tile span { font-size: 22px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .tile.principal { width: 320px; border: 2px solid var(--accent); background: rgba(255,255,255,0.10); box-shadow: 0 0 0 4px rgba(45,212,191,0.3), 0 30px 60px rgba(0,0,0,0.4); }
  .tile.principal span { font-size: 26px; }
  .foco, button:focus { outline: none; }
  .tile:focus, .tile.foco { -webkit-transform: scale(1.06); transform: scale(1.06); background: rgba(255,255,255,0.18); border-color: #FFC83D; box-shadow: 0 0 0 6px rgba(255,200,61,0.45), 0 34px 70px rgba(0,0,0,.45); }
  #idioma:focus { -webkit-transform: scale(1.06); transform: scale(1.06); border-color: #FFC83D; box-shadow: 0 0 0 5px rgba(255,200,61,0.4); }

  /* Aviso (app no instalada, despertador) */
  #aviso { position: absolute; left: 50%; bottom: 96px; -webkit-transform: translateX(-50%); transform: translateX(-50%); display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; padding: 28px 40px; border-radius: 26px; background: rgba(20,24,22,0.82); border: 1px solid rgba(251,191,36,0.55); box-shadow: 0 30px 70px rgba(0,0,0,0.5); z-index: 30; max-width: 1200px; }
  #aviso .icono { width: 64px; height: 64px; border-radius: 50%; background: rgba(251,191,36,0.16); color: #FCD34D; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; -webkit-flex-shrink: 0; flex-shrink: 0; margin-right: 26px; }
  #aviso-titulo { font-size: 30px; font-weight: 700; }
  #aviso-texto { font-size: 22px; color: rgba(245,247,245,0.82); margin-top: 6px; }

  /* ── Activación ───────────────────────────── */
  #activar-velo { background: rgba(6,10,8,0.3); }
  #tarjeta-act { position: absolute; left: 50%; top: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); width: 980px; box-sizing: border-box; padding: 64px 72px; border-radius: 36px; text-align: center; box-shadow: 0 40px 90px rgba(0,0,0,0.45); }

  .llave { width: 88px; height: 88px; border-radius: 26px; margin: 0 auto; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; background: rgba(45,212,191,0.16); border: 1px solid rgba(45,212,191,0.5); color: var(--accent-claro); }

  #codigo { width: 560px; height: 120px; box-sizing: border-box; text-align: center; border-radius: 24px; border: 2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); color: var(--tinta); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 64px; font-weight: 700; letter-spacing: 0.14em; }

  #codigo::-webkit-input-placeholder { color: rgba(245,247,245,0.28); }
  #codigo.mal { border-color: #FB923C; }
  #act-error { font-size: 24px; color: #FED7AA; min-height: 32px; }
  #btn-activar { min-width: 360px; height: 88px; border-radius: 22px; border: 0; background: var(--accent); color: #062A24; font-size: 28px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  #btn-activar:focus { box-shadow: 0 0 0 6px rgba(255,200,61,0.55); }
  #btn-activar[disabled] { opacity: 0.55; }
  .listo { width: 104px; height: 104px; border-radius: 50%; margin: 0 auto; background: var(--accent); color: #062A24; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; }

  /* ── Extras ───────────────────────────────── */
  .velo-oscuro { background: rgba(6,10,8,0.38); }
  .pastilla-volver { position: absolute; left: 120px; top: 64px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; height: 56px; padding: 0 30px 0 20px; border-radius: 999px; background: rgba(10,14,12,0.55); border: 1.5px solid rgba(255,255,255,0.5); font-size: 20px; font-weight: 700; letter-spacing: 0.22em; cursor: pointer; }
  .pastilla-volver svg { margin-right: 12px; }
  .pastilla-volver:focus { border-color: #FFC83D; box-shadow: 0 0 0 5px rgba(255,200,61,0.4); }
  .titulo-lado { position: absolute; left: 120px; top: 200px; }
  .titulo-lado .grande { font-size: 84px; font-weight: 300; line-height: 1; }
  .titulo-lado .sub { font-size: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.78); margin-top: 12px; }
  #tarjetas { position: absolute; left: 640px; top: 200px; width: 1160px; height: 560px; }
  .tarjeta { position: absolute; top: 0; width: 564px; height: 560px; overflow: hidden; padding: 0; border-radius: 28px; border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 20px 40px rgba(0,0,0,0.3); cursor: pointer; text-align: left; background: transparent; transition: transform .16s ease, box-shadow .16s ease; }
  .tarjeta:first-child { left: 0; } .tarjeta + .tarjeta { left: 596px; }
  .tarjeta .tinte { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .tarjeta .dibujo { position: absolute; left: 50%; top: 70px; margin-left: -85px; width: 170px; height: 170px; color: rgba(255,255,255,0.42); }
  .tarjeta .sombra { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(to top, rgba(8,12,10,0.88) 0%, rgba(8,12,10,0.25) 48%, rgba(8,12,10,0) 70%); }
  .tarjeta .ok { position: absolute; top: 20px; right: 20px; background: var(--accent); color: #062A24; font-weight: 800; font-size: 16px; letter-spacing: 0.14em; padding: 8px 16px; border-radius: 999px; display: none; }
  .tarjeta .textos { position: absolute; left: 30px; right: 30px; bottom: 28px; }
  .tarjeta .num { font-size: 16px; letter-spacing: 0.3em; font-weight: 800; color: var(--accent-claro); }
  .tarjeta .nombre { font-size: 40px; font-weight: 600; line-height: 1.1; margin-top: 6px; }
  .tarjeta .detalle { font-size: 20px; color: rgba(255,255,255,0.85); margin-top: 6px; }
  .tarjeta:focus { border: 3px solid #FFC83D; box-shadow: 0 0 0 7px rgba(255,200,61,0.3), 0 26px 50px rgba(0,0,0,0.45); -webkit-transform: scale(1.02); transform: scale(1.02); }
  .tarjeta:focus .ok { display: block; }
  .tarjeta.apagada .tinte { opacity: 0.55; }
  .teclas { position: absolute; left: 120px; bottom: 64px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; font-size: 19px; color: rgba(255,255,255,0.8); }
  .teclas > span { margin-right: 34px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; }
  .tecla { display: inline-block; min-width: 24px; height: 34px; line-height: 34px; padding: 0 10px; margin-right: 12px; text-align: center; border-radius: 9px; border: 1.5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.06); font-size: 15px; font-weight: 700; }
  .tecla.blanca { background: #F5F7F5; color: #111; border-color: #F5F7F5; font-weight: 800; }

  /* ── Clima ────────────────────────────────── */
  #clima-ahora { position: absolute; left: 120px; top: 230px; width: 620px; }
  #clima-ahora .temp { font-size: 190px; font-weight: 300; line-height: 1; }
  #clima-ahora .desc { font-size: 34px; font-weight: 600; margin-top: 10px; }
  #clima-ahora .ciudad { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.75); margin-top: 8px; }
  #clima-ahora .datos { margin-top: 36px; font-size: 22px; color: rgba(255,255,255,0.85); }
  #clima-ahora .datos div + div { margin-top: 10px; }
  #clima-icono { position: absolute; left: 520px; top: 230px; width: 200px; height: 200px; color: rgba(255,255,255,0.9); }
  #dias { position: absolute; left: 800px; top: 230px; width: 1000px; height: 520px; }
  .dia { position: absolute; top: 0; width: 184px; height: 520px; box-sizing: border-box; border-radius: 26px; padding: 34px 0; text-align: center; }
  .dia .nombre-dia { font-size: 22px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .dia svg { width: 84px; height: 84px; margin: 46px auto; display: block; color: rgba(255,255,255,0.92); }
  .dia .max { font-size: 44px; font-weight: 600; }
  .dia .min { font-size: 28px; color: rgba(255,255,255,0.6); margin-top: 6px; }
  .dia .lluvia { font-size: 20px; color: var(--accent-claro); margin-top: 26px; }
  .sin-dato { font-size: 28px; color: rgba(255,255,255,0.7); }

  /* ── Wallpaper (Ambient) ──────────────────── */
  #ambient { background: #000; z-index: 20; }
  .abm-capa { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; transition: opacity .9s ease; }
  .abm-capa.visible { opacity: 1; }
  .abm-ph { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background-size: cover; background-position: center; -webkit-animation: abmKb 24s linear forwards; animation: abmKb 24s linear forwards; }
  @-webkit-keyframes abmKb { from { -webkit-transform: scale(1); } to { -webkit-transform: scale(1.07); } }
  @keyframes abmKb { from { transform: scale(1); } to { transform: scale(1.07); } }
  .abm-vid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #abm-sombra { position: absolute; left: 0; right: 0; bottom: 0; height: 32vh; z-index: 3; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.38)); }
  #abm-hud { position: absolute; right: 63px; bottom: 56px; z-index: 4; text-align: right; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
  #abm-hora { font-size: 71px; font-weight: 300; line-height: 1; }
  #abm-linea { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: end; justify-content: flex-end; font-size: 20px; margin-top: 11px; }
  #abm-linea svg { width: 27px; height: 27px; margin: 0 9px 0 21px; }

  /* ── Despertador ─────────────────────────── (hospitality 8.25, medidas pasadas a px de 1920×1080) */
  #desp-caja { position: absolute; left: 600px; top: 150px; width: 1200px; height: 790px; box-sizing: border-box; border-radius: 34px; padding: 52px 64px; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; box-shadow: 0 30px 70px rgba(0,0,0,0.35); }
  #desp-caja.col { -webkit-box-orient: vertical; flex-direction: column; -webkit-box-align: stretch; align-items: stretch; -webkit-box-pack: start; justify-content: flex-start; padding: 56px 64px; }
  #desp-caja.col > * + * { margin-top: 30px; }
  .d-ojo { font-size: 18px; letter-spacing: 0.3em; font-weight: 800; color: var(--accent-claro); text-transform: uppercase; }
  .d-dial { position: relative; -webkit-flex-shrink: 0; flex-shrink: 0; width: 520px; height: 520px; box-sizing: border-box; border-radius: 50%; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.22); margin-right: 56px; }
  .d-dial svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .d-n { position: absolute; width: 10%; height: 10%; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; font-size: 28px; font-weight: 300; }
  .d-n.on { color: #062A24; font-weight: 700; font-size: 32px; }
  .d-col { -webkit-box-flex: 1; flex: 1 1 0; min-width: 0; display: -webkit-box; display: flex; -webkit-box-orient: vertical; flex-direction: column; }
  .d-col > * + * { margin-top: 34px; }
  .d-tiempo { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; }
  .d-num { box-sizing: border-box; padding: 6px 22px; border-radius: 24px; border: 1.5px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); font-size: 96px; font-weight: 300; line-height: 1.1; }
  .d-num.act { border: 3px solid var(--accent); background: rgba(45,212,191,0.14); }
  .d-dos { font-size: 88px; font-weight: 300; opacity: 0.7; line-height: 1; margin: 0 14px; }
  .d-ampm { margin-left: 28px; }
  .d-ap { width: 84px; height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; font-size: 22px; opacity: 0.65; }
  .d-ap + .d-ap { margin-top: 8px; }
  .d-ap.on { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); font-weight: 800; opacity: 1; }
  .d-ayuda { font-size: 22px; opacity: 0.8; line-height: 1.5; }
  .d-paso { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; font-size: 20px; opacity: 0.85; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .d-pn { display: inline-block; width: 40px; height: 40px; line-height: 40px; text-align: center; border-radius: 50%; background: var(--accent); color: #062A24; font-weight: 800; margin: 0 14px; }
  .d-de { opacity: 0.6; }
  .d-btn { height: 84px; box-sizing: border-box; border-radius: 24px; background: #F5F7F5; color: #111; display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; font-size: 26px; font-weight: 800; }
  .d-btn svg { width: 32px; height: 32px; margin-right: 14px; }
  .d-btn.sec { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.3); color: #F5F7F5; font-weight: 700; }
  .d-btn.foco, .d-dia.foco, .d-una.foco { box-shadow: 0 0 0 4px #0c130f, 0 0 0 9px #FFC83D; }
  .d-hora { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; }
  .d-hora svg { width: 60px; height: 60px; color: var(--accent-claro); margin-right: 22px; }
  .d-hora-t { font-size: 104px; font-weight: 300; line-height: 1; }
  .d-hora-ap { font-size: 34px; font-weight: 700; opacity: 0.8; -webkit-align-self: flex-end; align-self: flex-end; padding-bottom: 12px; margin-left: 22px; }
  .d-una { height: 84px; box-sizing: border-box; border-radius: 22px; border: 1.5px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.06); display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; padding: 0 30px; font-size: 26px; color: rgba(255,255,255,0.85); }
  .d-radio { -webkit-flex-shrink: 0; flex-shrink: 0; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); margin-right: 16px; }
  .d-una.on .d-radio { border: 9px solid var(--accent); }
  .d-una-n { margin-left: auto; font-size: 19px; opacity: 0.6; }
  .d-dias { display: -webkit-box; display: flex; margin-top: 16px; }
  .d-dia { width: 118px; height: 96px; box-sizing: border-box; border-radius: 22px; display: -webkit-box; display: flex; -webkit-box-orient: vertical; flex-direction: column; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; font-size: 26px; font-weight: 700; letter-spacing: 0.04em; border: 1.5px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
  .d-dia + .d-dia { margin-left: 14px; }
  .d-dia.on { background: var(--accent); border-color: var(--accent); color: #062A24; }
  .d-res { border-radius: 20px; background: rgba(45,212,191,0.10); border: 1px solid rgba(45,212,191,0.4); padding: 20px 28px; font-size: 23px; line-height: 1.5; }
  .d-res span { opacity: 0.78; }
  .d-res.err { background: rgba(224,90,70,0.14); border-color: rgba(224,90,70,0.5); }

  #negro { background: #000; z-index: 40; }

<body>
<div id="stage">
  <div id="fondo-glass" class="lleno">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
    <div class="lleno vin-1"></div><div class="lleno vin-2"></div>
  </div>
  <div id="fondo-medio" class="lleno oculto"></div>
  <div id="fondo-velo" class="lleno oculto"></div>

  <!-- Activación con el código de 8 números -->
  <section id="p-activar" class="pantalla oculto" aria-labelledby="act-titulo">
    <div id="activar-velo" class="lleno"></div>

      v.onerror = function () { abmTimer = setTimeout(siguienteAmbient, 4000); };
      capa.appendChild(v);
      var p = v.play();
      if (p && p.catch) p.catch(function () {
        // Esta caja no deja arrancar videos solos: se usan solo las fotos (el APK v2 lo arregla).
        videosBloqueados = true; listaAmbient = null; idxAmbient = -1; abmTimer = setTimeout(siguienteAmbient, 300);
      });
      if (!unico) abmTimer = setTimeout(siguienteAmbient, 180000);
    } else {
      var ph = document.createElement('div');
      ph.className = 'abm-ph';
      ph.style.backgroundImage = 'url("' + String(item.url).replace(/"/g, '%22') + '")';
      if (item.image_pos) ph.style.backgroundPosition = item.image_pos.split(',').map(function (n) { return Number(n) + '%'; }).join(' ');
      capa.appendChild(ph);
      if (!unico) abmTimer = setTimeout(siguienteAmbient, 12000);
    }
    capa.classList.add('visible');
    vieja.classList.remove('visible');
    setTimeout(function () { if (!vieja.classList.contains('visible')) { soltarVideos(vieja); vieja.innerHTML = ''; } }, 1000);
  }
  function hud() {
    var d = new Date(), x = t();
    $('abm-hora').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    // «Sábado, 17 de octubre» / «Saturday, October 17»: solo mayúscula inicial (y meses en inglés).
    var f = x.fecha(d, x).toLowerCase();
    f = idioma === 'en' ? f.replace(/(^|\s)[a-z]/g, function (s) { return s.toUpperCase(); }) : f.charAt(0).toUpperCase() + f.slice(1);
    var linea = '<span>' + esc(f) + '</span>';
    if (clima && clima.ahora) linea += svgIc(icono(clima.ahora.codigo, clima.ahora.es_de_dia)) + '<span>' + esc(grados(clima.ahora.temp)) + '</span>';
    $('abm-linea').innerHTML = linea;
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) salirAmbient(); else ultimaActividad = Date.now(); });

  // ── Despertador (APK v2) ──────────────────────────────────────────────────
  // La alarma NO vive aquí: se programa en la caja por TVLite.despertador*, que la guarda, despierta la
  // caja a la hora (eso enciende la TV por CEC) y pone la pantalla «Buenos días». Días: bit 0 = lunes …
  // bit 6 = domingo; 0 = solo una vez (se borra al sonar). Con días marcados se repite cada semana.
  var dPaso = 1, dH = 7, dM = 0, dPM = false, dDias = 0, dFoco = 7, dEstado = null, dError = '';
  function despHay() {
    try { return !!(window.TVLite && typeof window.TVLite.despertadorEstado === 'function' && typeof window.TVLite.despertadorProgramar === 'function'); }
    catch (e) { return false; }
  }
  function despLeer() {
    if (!despHay()) return null;
    try { var o = JSON.parse(window.TVLite.despertadorEstado()); return (o && typeof o === 'object') ? o : null; } catch (e) { return null; }
  }
  function despActivo(st) { return !!(st && st.activo === true && typeof st.hora === 'number' && st.hora >= 0 && st.hora <= 23 && typeof st.minuto === 'number'); }
  function d2(n) { return (n < 10 ? '0' : '') + n; }
  function dH24() { return (dH % 12) + (dPM ? 12 : 0); }
  function horaTxt(h24, m) { return ((h24 % 12) || 12) + ':' + d2(m); }
  function amPm(h24) { return h24 >= 12 ? 'PM' : 'AM'; }
  function pintarTarjetaDesp() {
    var x = t(), card = $('card-despertador');
    if (!despHay()) { card.classList.add('apagada'); $('desp-detalle').textContent = x.despProx; return; }
    card.classList.remove('apagada');
    var st = despLeer();
    $('desp-detalle').textContent = despActivo(st) ? x.despActivo + ' · ' + horaTxt(st.hora, st.minuto) + ' ' + amPm(st.hora) : x.despLibre;
  }
  // Próxima fecha de cada día de la semana, de ahora a 7 días (la misma regla que la caja).
  function despProximas(h24, m) {
    var ahora = new Date(), out = {};
    for (var d = 0; d <= 7; d++) {
      var f = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() + d, h24, m, 0, 0);
      if (f.getTime() > ahora.getTime()) { var b = (f.getDay() + 6) % 7; if (!(b in out)) out[b] = f; }
    }
    return out;
  }
  function despCuando(f) {
    var x = t().d, hoy = new Date();
    var dd = Math.round((new Date(f.getFullYear(), f.getMonth(), f.getDate()).getTime() - new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).getTime()) / 864e5);
    var nombre = x.largo[(f.getDay() + 6) % 7] + ' ' + f.getDate();
    if (dd === 0) return x.hoy;
    if (dd === 1) return x.manana + ', ' + nombre;
    return nombre;
  }
  function despLista(a, y) { return a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + y + a[a.length - 1]; }
  // Texto del recuadro: {a: línea principal (HTML ya escapado), b: segunda línea}.
  function despResumen(h24, m, dias) {
    var x = t().d, prox = despProximas(h24, m), hora = x.alas((h24 % 12) || 12) + horaTxt(h24, m) + ' ' + amPm(h24);
    if (!dias) {
      var primera = null;
      Object.keys(prox).forEach(function (k) { if (!primera || prox[k] < primera) primera = prox[k]; });
      var cuando = despCuando(primera).split(',')[0];   // «hoy» / «mañana»
      return { a: x.unaA(esc(cuando), esc(hora)), b: x.unaB };
    }
    var cual = dias === 127 ? x.todos : dias === 31 ? x.semana : dias === 96 ? x.finde : null;
    if (!cual) { var nombres = []; for (var b = 0; b < 7; b++) if (dias & (1 << b)) nombres.push(x.plural[b]); cual = x.repLos(despLista(nombres, x.y)); }
    var sig = null;
    for (var b2 = 0; b2 < 7; b2++) if ((dias & (1 << b2)) && prox[b2] && (!sig || prox[b2] < sig)) sig = prox[b2];
    return { a: x.repA(esc(cual), esc(hora)), b: x.repB(despCuando(sig)) };
  }
  function despAbrir() {
    var st = despLeer();
    dEstado = st;
    if (despActivo(st)) { dPM = st.hora >= 12; dH = (st.hora % 12) || 12; dM = Math.max(0, Math.min(59, st.minuto)); dDias = (typeof st.dias === 'number') ? (st.dias & 127) : 0; }
    else { dH = 7; dM = 0; dPM = false; dDias = 0; }   // 7:00 AM y «Solo una vez» preseleccionados
    dPaso = 1; dFoco = 7; dError = '';
    mostrar('despertador');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    despPintar();
  }
  // BACK dentro del despertador: un paso atrás (días → minutos → hora) y luego a Extras.
  function despAtras() {
    if (dPaso === 2 || dPaso === 3) { dPaso--; dError = ''; despPintar(); return; }
    volver();
  }
  function despActivar() {
    dError = '';
    try {
      var r = JSON.parse(window.TVLite.despertadorProgramar(dH24(), dM, dDias, idioma));
      dEstado = (r && typeof r === 'object') ? r : null;
      if (despActivo(dEstado)) dPaso = 4; else dError = t().d.error;
    } catch (e) { dError = t().d.error; }
    despPintar();
  }
  function despQuitar() {
    try { dEstado = JSON.parse(window.TVLite.despertadorCancelar()); } catch (e) { dEstado = null; }
    volver();
  }
  function despTecla(e) {
    var k = e.key, kc = e.keyCode;
    var dir = TECLAS[k] || CODIGOS[kc];
    var ok = k === 'Enter' || k === ' ' || kc === 13;
    var atras = k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'GoBack';
    if (!dir && !ok && !atras) return;
    e.preventDefault(); e.stopPropagation();
    if (atras) { despAtras(); return; }
    if (dPaso === 1) {
      if (dir === 'der') dH = dH === 12 ? 1 : dH + 1;
      else if (dir === 'izq') dH = dH === 1 ? 12 : dH - 1;
      else if (dir === 'arr' || dir === 'aba') dPM = !dPM;
      else if (ok) dPaso = 2;
    } else if (dPaso === 2) {
      if (dir === 'der') dM = (dM + 1) % 60;
      else if (dir === 'izq') dM = (dM + 59) % 60;
      else if (dir === 'arr') dM = (dM + 5) % 60;
      else if (dir === 'aba') dM = (dM + 55) % 60;
      else if (ok) { dPaso = 3; dFoco = 7; }
    } else if (dPaso === 3) {
      var f = dFoco;
      if (dir === 'arr') { if (f >= 7) dFoco = 0; else if (f >= 0) dFoco = -1; }
      else if (dir === 'aba') { if (f === -1) dFoco = 0; else if (f >= 0 && f <= 6) dFoco = 7; }
      else if (dir === 'izq') { if (f >= 1 && f <= 6) dFoco = f - 1; else if (f === 8) dFoco = 7; }
      else if (dir === 'der') { if (f >= 0 && f <= 5) dFoco = f + 1; else if (f === 7 && despActivo(dEstado)) dFoco = 8; }
      else if (ok) {
        if (f === -1) dDias = 0;
        else if (f >= 0 && f <= 6) dDias = dDias ^ (1 << f);
        else if (f === 7) { despActivar(); return; }
        else if (f === 8) { despQuitar(); return; }
        dError = '';
      }
    } else if (dPaso === 4) {
      if (ok) { volver(); return; }
    }
    despPintar();
  }
  var IC_CHECK = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>';
  var IC_ALARMA = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"></circle><path d="M12 9v4l2.5 2M5 4L2 7M19 4l3 3"></path></svg>';
  function despDial() {
    var horas = dPaso === 1, sel = horas ? (dH % 12) : dM;
    var rad = (horas ? sel * 30 : sel * 6) * Math.PI / 180;
    var x = (320 + 240 * Math.sin(rad)).toFixed(1), y = (320 - 240 * Math.cos(rad)).toFixed(1), nums = '';
    for (var i = 0; i < 12; i++) {
      var a = i * 30 * Math.PI / 180, nx = 320 + 240 * Math.sin(a), ny = 320 - 240 * Math.cos(a);
      var on = horas ? (i === sel) : (dM === i * 5);
      nums += '<div class="d-n' + (on ? ' on' : '') + '" style="left:' + ((nx - 32) / 6.4).toFixed(3) + '%;top:' + ((ny - 32) / 6.4).toFixed(3) + '%">' + (horas ? (i === 0 ? 12 : i) : d2(i * 5)) + '</div>';
    }
    return '<div class="d-dial"><svg viewBox="0 0 640 640" aria-hidden="true">' +
      '<line x1="320" y1="320" x2="' + x + '" y2="' + y + '" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round"></line>' +
      '<circle cx="320" cy="320" r="9" fill="#2DD4BF"></circle><circle cx="' + x + '" cy="' + y + '" r="42" fill="#2DD4BF"></circle></svg>' + nums + '</div>';
  }
  function despPasoHtml(n) { var x = t().d; return '<div class="d-paso">' + esc(x.paso) + '<span class="d-pn">' + n + '</span><span class="d-de">' + esc(x.de3) + '</span></div>'; }
  function despHoraGrande() { var h = dH24(); return '<div class="d-hora">' + IC_ALARMA + '<div class="d-hora-t">' + horaTxt(h, dM) + '</div><div class="d-hora-ap">' + amPm(h) + '</div></div>'; }
  function despResumenHtml() {
    if (dError) return '<div class="d-res err">' + esc(dError) + '</div>';
    var r = despResumen(dH24(), dM, dDias);
    return '<div class="d-res">' + r.a + '<br><span>' + esc(r.b) + '</span></div>';
  }
  function despTeclas() {
    var x = t().d;
    function kb(tecla, txt, blanca) { return '<span><span class="tecla' + (blanca ? ' blanca' : '') + '">' + tecla + '</span>' + esc(txt) + '</span>'; }
    if (dPaso === 1) return kb('◀ ▶', x.girar) + kb('▲ ▼', 'AM / PM') + kb('OK', x.siguiente, true) + kb('↩', t().volver);
    if (dPaso === 2) return kb('◀ ▶', x.mas1) + kb('▲ ▼', x.mas5) + kb('OK', x.siguiente, true) + kb('↩', x.volverHora);
    if (dPaso === 3) return kb('◀ ▶', x.moverDias) + kb('OK', x.marcar, true) + kb('▲ ▼', x.arribaAbajo) + kb('↩', x.volverMin);
    return kb('OK', x.listo, true);
  }
  function despPintar() {
    var x = t().d, caja = $('desp-caja'), html = '';
    if (dPaso === 1 || dPaso === 2) {
      var p1 = dPaso === 1;
      caja.className = 'vidrio';
      html = despDial() + '<div class="d-col">' +
        '<div class="d-ojo">' + esc(p1 ? x.ojoHora : x.ojoMin) + '</div>' +
        '<div class="d-tiempo"><div class="d-num' + (p1 ? ' act' : '') + '">' + d2(dH) + '</div><div class="d-dos">:</div><div class="d-num' + (p1 ? '' : ' act') + '">' + d2(dM) + '</div>' +
          '<div class="d-ampm"><div class="d-ap' + (dPM ? '' : ' on') + '">AM</div><div class="d-ap' + (dPM ? ' on' : '') + '">PM</div></div></div>' +
        '<div class="d-ayuda">' + esc(p1 ? x.ayudaHora : x.ayudaMin) + '</div>' + despPasoHtml(dPaso) +
        '<div class="d-btn">' + esc(p1 ? x.sigMin : x.sigDias) + '</div></div>';
    } else if (dPaso === 3) {
      var dias = '';
      for (var b = 0; b < 7; b++) {
        dias += '<div class="d-dia' + ((dDias & (1 << b)) ? ' on' : '') + (dFoco === b ? ' foco' : '') + '"><span>' + x.corto[b] + '</span></div>';
      }
      caja.className = 'vidrio col';
      html = '<div class="d-ojo">' + esc(x.ojoDias) + '</div>' + despHoraGrande() +
        '<div><div class="d-una' + (dDias === 0 ? ' on' : '') + (dFoco === -1 ? ' foco' : '') + '"><span class="d-radio"></span>' + esc(x.unaVez) + '<span class="d-una-n">' + esc(x.unaVezN) + '</span></div>' +
        '<div class="d-dias">' + dias + '</div></div>' + despResumenHtml() +
        '<div class="d-pie">' + despPasoHtml(3) +
          '<div class="d-btn' + (dFoco === 7 ? ' foco' : '') + '">' + IC_CHECK + esc(x.activar) + '</div>' +
          (despActivo(dEstado) ? '<div class="d-btn sec' + (dFoco === 8 ? ' foco' : '') + '">' + esc(x.quitar) + '</div>' : '') + '</div>';
    } else {
      caja.className = 'vidrio col';
      html = '<div class="d-ojo">' + esc(x.ojoListo) + '</div>' + despHoraGrande() + despResumenHtml() +
        '<div class="d-pie"><div class="d-btn foco">' + IC_CHECK + esc(x.listo) + '</div></div>';
    }
    caja.innerHTML = html;
    var hoy = new Date();
    $('desp-fecha').textContent = x.largo[(hoy.getDay() + 6) % 7] + ' ' + hoy.getDate() + ' ' + x.meses[hoy.getMonth()];
    $('desp-teclas').innerHTML = despTeclas();
  }
  // La pantalla «Buenos días» es nativa y no espera al internet: se le deja el clima de ahora, ya en °C o °F.
  function climaALaCaja() {
    if (VISTA || !clima || !clima.ahora || !window.TVLite || typeof window.TVLite.despertadorClima !== 'function') return;
    var f = cfg && cfg.clima && cfg.clima.unidad === 'F';
    function u(c) { return (c === null || c === undefined || isNaN(Number(c))) ? NaN : (f ? Number(c) * 9 / 5 + 32 : Number(c)); }
    var max = clima.dias && clima.dias[0] ? u(clima.dias[0].max) : NaN;
    try { window.TVLite.despertadorClima(u(clima.ahora.temp), max); } catch (e) { /* caja sin despertador */ }
  }

  // ── BACK y HOME del control (los manda el APK v2; el control no los entrega a la página) ──
  // true = la página usó la tecla; false = ya estaba en el inicio (cuenta para el escape de 5×BACK).
  window.__liteAtras = function () {
    if (ambientActivo) { salirAmbient(); return true; }
    if (pantalla === 'despertador') { despAtras(); return true; }
    if (pantalla === 'extras' || pantalla === 'clima') { volver(); return true; }
    return false;
  };
  window.__liteInicio = function () {
    salirAmbient();
    if (pantalla === 'extras' || pantalla === 'clima' || pantalla === 'despertador') mostrar('inicio', 'btn-vertv');
  };

  // ── Vista previa del panel ────────────────────────────────────────────────
  var NOMBRES_ACCION = { 'open-apps': 'la pantalla de apps', 'open-settings': 'los Ajustes de Android' };
  function avisoVista(url) {
    var m = /^vizionstv:\/\/([a-z-]+)/.exec(url) || [];
    var que = m[1] === 'launch-blackeye' || m[1] === 'launch-app' ? app().nombre : (NOMBRES_ACCION[m[1]] || 'esa opción');
    avisar('Vista previa', 'En la caja esto abre ' + que + '.');
  }
  function iniciarVista() {
    clima = null;
    mostrar('inicio');
    window.addEventListener('message', function (e) {
      if (ORIGENES_PANEL.indexOf(e.origin) < 0 || !e.data || e.data.tipo !== 'lite-vista') return;
      cfg = e.data.cfg || {};
      clima = e.data.clima || null;
      if (e.data.idioma === 'en' || e.data.idioma === 'es') idioma = e.data.idioma;
      pintarFondo(); pintarTextos();
      if (pantalla !== 'extras' && pantalla !== 'clima') mostrar('inicio');
      if (e.data.ambient) entrarAmbient(); else salirAmbient();
    });
    if (window.parent !== window) window.parent.postMessage({ tipo: 'lite-lista' }, '*'); // el panel contesta con la configuración
  }

  // ── Cajas con un APK de antes del Despertador ─────────────────────────────
  // El código de activación solo se pide con el APK v2 (el que trae el Despertador).
  // Las cajas con un APK anterior y sin activar siguen como siempre, sin pedir código:
  // saludo, hora, Ver TV, Apps (si su APK ya tenía el botón) y Ajustes. Las que ya
  // se activaron con el código siguen activadas.
  function apkConDespertador() { try { return !!(window.TVLite && typeof window.TVLite.despertadorEstado === 'function'); } catch (e) { return false; } }
  function esApkViejo() { return !apkConDespertador() && !leer(CLAVES.caja); }
  function modoViejo() {
    if (!window.TVLite || typeof window.TVLite.getApps !== 'function') $('btn-apps').classList.add('oculto');
    $('btn-extras').classList.add('oculto');
    mostrar('inicio');
  }

  // ── Arranque ──────────────────────────────────────────────────────────────
  pintarTextos();
  if (VISTA) {
    iniciarVista();
  } else if (esApkViejo()) {
    modoViejo();
  } else if (leer(CLAVES.caja)) {
    if (cfg) aplicar(cfg, true); // pinta al instante con lo guardado; luego se actualiza
    cargarConfig(!cfg);
    cargarClima();
  } else {
    pedirCodigo();
  }

  // Para el banco de pruebas y la vista previa del panel (sin efecto en la caja).
  window.__lite = { estado: function () { return { pantalla: pantalla, ambient: ambientActivo, videosBloqueados: videosBloqueados, idx: idxAmbient, lista: listaAmbient ? listaAmbient.length : null, desp: { paso: dPaso, h24: dH24(), m: dM, dias: dDias, foco: dFoco } }; }, ambientYa: function () { ultimaActividad = 0; revisarInactividad(); } };
})();
